<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova Shoes — Revisión de carpetas</title><style>body{font:16px Arial,sans-serif;background:#f4f7fb;color:#082b72;margin:0;padding:22px}main{max-width:620px;margin:auto;background:white;padding:22px;border-radius:18px;box-shadow:0 8px 25px #082b7215}h1{font-size:23px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7fb;padding:16px;border-radius:12px;line-height:1.6}a{color:#1249b8}small{color:#555}</style></head><body><main><h1>Nova Shoes · Revisión segura</h1><p>Esta página solo consulta si existen tus carpetas. <b>No cambia, borra ni copia ningún pedido.</b></p><pre id="out">Revisando…</pre><p><a href="./">Regresar a mi Nova Shoes original</a></p><small>Comparte una captura del resultado. No muestra nombres de clientas ni importes.</small></main><script>(function(){var lines=[];try{var k='nova_order_date_folders_v1';var s=localStorage.getItem(k);lines.push('Sitio: '+location.origin);lines.push('Almacenamiento: accesible');lines.push('Clave de carpetas: '+(s===null?'NO ENCONTRADA':'ENCONTRADA'));if(s!==null){lines.push('Datos guardados: '+s.length+' caracteres');try{var obj=JSON.parse(s);lines.push('Formato: '+(Array.isArray(obj)?'lista':typeof obj));lines.push('Cantidad de carpetas: '+(obj&&typeof obj==='object'?Object.keys(obj).length:'no determinada'));}catch(e){lines.push('Error al interpretar carpetas: '+e.message)}}var keys=Object.keys(localStorage);lines.push('Total de claves de Nova: '+keys.filter(function(x){return x.startsWith('nova_')}).length);lines.push('Otras claves de pedidos: '+keys.filter(function(x){return /^nova_/.test(x)&&/order|folder|excel|import/i.test(x)}).length)}catch(e){lines.push('Error: '+e.message)}document.getElementById('out').textContent=lines.join('\n')})();</script></body></html>
